services:
  web:
    build: .
    command: sh -c "python manage.py collectstatic --noinput && gunicorn" 
      config.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env